<!DOCTYPE html>
<html>
    <head>
        <title>Payroll</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
        <style>
            @font-face {
            font-family: "AritaBuri";
            src: url("HTML_Assets/fonts/Arita-buriM.otf") format("opentype");
            }
            
            body {
                font-family: "AritaBuri";
                margin: 0;
                height: 100vh;
                background: 
                    url('HTML_Assets/bg/Netzach.png') no-repeat center center;
                    background-size: cover;
            }

            h1,
            h2,
            h3,
            h4,
            h5,
            h6 {
                font-family: "AritaBuri";
                letter-spacing: 5px;
            }
            .text-box {
                position: absolute;      
                top: 50%;                
                left: 32%;               
                transform: translateY(-50%); 
                width: 35%;              
                padding: 20px;           
                background: rgba(0, 0, 0, 0.6); 
                border-radius: 10px;     
                color: yellow;         
            }
        </style>
    </head>
<body>

    <!-- Navbar (sit on top) -->
    <div class="w3-top">
        <div class="w3-bar w3-padding w3-card w3-text-yellow"
         style="
         background-image: url('HTML_Assets/bg/Manual_Default_background.png');
         background-size: cover;
         background-position: center;
         background-repeat: no-repeat;
         height: 60px; /* adjust bar height */
         letter-spacing: 4px;
         ">
            <a href="index.html" class="w3-bar-item w3-button sfx">The Library</a>
            <!-- Right-sided navbar links. Hide them on small screens -->
            <div class="w3-right w3-hide-small">
                <a href="Book1.html" class="w3-bar-item w3-button sfx"> Book 1 |</a>
                <a href="Book2.html" class="w3-bar-item w3-button sfx"> Book 2 |</a>
                <a href="Book3.html" class="w3-bar-item w3-button sfx"> Book 3 |</a>
                <a href="Book4.html" class="w3-bar-item w3-button sfx"> Book 4 |</a>
            </div>
        </div>
    </div>

    <header class="w3-display-container w3-content w3-wide" style="max-width:1600px;min-width:500px" id="home">
        <div class="w3-display-bottomleft w3-padding-large w3-opacity">
            <h1 class="w3-xxlarge">The Library</h1>
        </div>
    </header>
        
    <section>
         <div class="text-box" style="text-align: center;">
            <h1>Simple Payroll Program</h1>
            <div>
                <input type="text" id="employeeName" placeholder="Employee Name">
                <input type="number" id="daysWorked" placeholder="Days Worked">
                <input type="number" id="dailyRate" placeholder="Daily Rate">
                <input type="number" id="deduction" placeholder="Deduction Amount">
            </div>
            <div>
                <button onclick="addEmployee()">Add Employee</button>
                <button onclick="deleteEmployee()">Delete Employee</button>
            </div>

            <table class="payroll-table" id="payrollTable">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Employee Name</th>
                        <th>Days Worked</th>
                        <th>Daily Rate</th>
                        <th>Gross Pay</th>
                        <th>Deduction Amount</th>
                        <th>Net Pay</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </section>
   
    </div>
</body>
    
<script>

document.querySelectorAll(".sfx").forEach(btn => {  
    // Hover sound
   btn.addEventListener("mouseenter", () => {
        new Audio("HTML_Assets/sfx/hover.wav").play();
    });
    
});

let payrollList = [];

        function addEmployee() {
            const name = document.getElementById("employeeName").value;
            const days = parseFloat(document.getElementById("daysWorked").value);
            const rate = parseFloat(document.getElementById("dailyRate").value);
            const deduction = parseFloat(document.getElementById("deduction").value);

            if (!name || isNaN(days) || isNaN(rate) || isNaN(deduction)) {
                alert("Please fill all fields correctly.");
                return;
            }

            const grossPay = days * rate;
            const netPay = grossPay - deduction;

            payrollList.push({name, days, rate, deduction, grossPay, netPay});
            renderTable();

            document.getElementById("employeeName").value = '';
            document.getElementById("daysWorked").value = '';
            document.getElementById("dailyRate").value = '';
            document.getElementById("deduction").value = '';
        }

        function deleteEmployee() {
            const lineNo = parseInt(prompt("Enter the line number to delete:"));
            if (isNaN(lineNo) || lineNo < 1 || lineNo > payrollList.length) {
                alert("Invalid line number.");
                return;
            }
            payrollList.splice(lineNo - 1, 1);
            renderTable();
        }

        function renderTable() {
            const tbody = document.querySelector("#payrollTable tbody");
            tbody.innerHTML = '';

            payrollList.forEach((employee, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td class="payroll-glow">${employee.name}</td>
                    <td class="payroll-glow">${employee.days}</td>
                    <td class="payroll-glow">${employee.rate.toFixed(2)}</td>
                    <td class="payroll-glow">${employee.grossPay.toFixed(2)}</td>
                    <td class="payroll-glow">${employee.deduction.toFixed(2)}</td>
                    <td class="payroll-glow">${employee.netPay.toFixed(2)}</td>
                `;
                tbody.appendChild(row);
            });
        }
</script>
</html>
